<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日常チェック記録</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#202833;--muted:#687482;--accent:#287d68;--soft:#e8f4ef;--border:#e1e6ea}
*{box-sizing:border-box}body{margin:0;padding:28px 16px 40px;min-height:100vh;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:100%;max-width:560px;margin:auto}.eyebrow{margin:0 0 7px;color:var(--accent);font-size:.78rem;font-weight:750;letter-spacing:.1em}
h1{margin:0;font-size:clamp(1.55rem,5vw,2rem)}.lead{margin:9px 0 22px;color:var(--muted);line-height:1.65;font-size:.94rem}
.summary{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 17px;margin-bottom:13px;background:var(--soft);border-radius:15px}
.summary-label{font-size:.9rem;font-weight:650}.summary-count{color:var(--accent);font-weight:800;white-space:nowrap}
.track{height:6px;margin-top:9px;overflow:hidden;background:#d2e7de;border-radius:99px}.bar{width:0;height:100%;background:var(--accent);transition:width .2s}
.items{display:grid;gap:10px}.item{display:flex;align-items:flex-start;gap:13px;padding:16px;background:var(--card);border:1px solid var(--border);border-radius:15px}
.item.done{border-color:#a9d2c3;background:#fcfefc}.item input{width:23px;height:23px;flex:0 0 auto;margin:2px 0 0;accent-color:var(--accent);cursor:pointer}
.item-content{min-width:0;flex:1}.item-name{display:block;font-weight:700;line-height:1.45;overflow-wrap:anywhere}.done .item-name{color:var(--accent)}
.timestamp{display:block;margin-top:5px;color:var(--muted);font-size:.8rem}.remove{padding:5px 8px;color:var(--muted);background:transparent;border:0;border-radius:7px;font:inherit;font-size:.78rem;cursor:pointer}
.remove:hover{color:#b54747;background:#fff0f0}.reset-row{display:flex;justify-content:flex-end;margin-top:12px}
.reset-row button{padding:9px 12px;color:var(--muted);background:#fff;border:1px solid var(--border);border-radius:9px;font:inherit;font-size:.84rem;cursor:pointer}
.reset-row button:hover{background:#eef1f3}
.add-panel{margin-top:18px;padding:17px;background:var(--card);border:1px solid var(--border);border-radius:15px}
.add-panel h2{margin:0 0 11px;font-size:1rem}.add-row{display:flex;gap:8px}.add-row input{min-width:0;flex:1;padding:11px 12px;border:1px solid #ccd4db;border-radius:9px;font:inherit;font-size:.95rem}
.add-row button{padding:10px 15px;color:white;background:var(--accent);border:0;border-radius:9px;font:inherit;font-weight:700;cursor:pointer}
.notice{min-height:1.4em;margin:9px 1px 0;color:#b54747;font-size:.82rem}.footer{margin-top:18px;color:var(--muted);font-size:.78rem;line-height:1.6;text-align:center}
@media(max-width:390px){body{padding:22px 12px 32px}.item{padding:14px 12px;gap:10px}.add-row button{padding-inline:12px}}
</style>
</head>
<body>
<main>
<p class="eyebrow">DAILY RECORD</p>
<h1>日常チェック記録</h1>
<p class="lead">実行できた項目にチェックを付けると、チェックした日時が記録されます。</p>
<section class="summary" aria-live="polite"><div style="flex:1"><div class="summary-label">実行状況</div><div class="track"><div class="bar" id="progress"></div></div></div><div class="summary-count" id="count">0 / 3 件</div></section>
<section class="items" id="items" aria-label="チェック項目"></section>
<div class="reset-row"><button type="button" id="resetChecks">すべてのチェックをオフ</button></div>
<section class="add-panel"><h2>新しい項目を追加</h2><form class="add-row" id="addForm"><input id="newItem" type="text" maxlength="60" placeholder="例：エアコンを消す" aria-label="追加する項目名"><button type="submit">追加</button></form><p class="notice" id="notice" role="status"></p></section>
<p class="footer">記録はこのブラウザのローカルストレージに保存されます。<br>同じブラウザで開くと、前回の状態を引き継ぎます。</p>
</main>
<script>
const STORAGE_KEY='daily-execution-record-v2';
const DEFAULT_ITEMS=[
{id:'door-lock',name:'鍵の施錠',checked:false,checkedAt:null},
{id:'window-lock',name:'窓の施錠',checked:false,checkedAt:null},
{id:'room-light',name:'部屋の消灯',checked:false,checkedAt:null}
];
const listElement=document.getElementById('items');
const countElement=document.getElementById('count');
const progressElement=document.getElementById('progress');
const noticeElement=document.getElementById('notice');
const form=document.getElementById('addForm');
const newItemInput=document.getElementById('newItem');

function loadItems(){
 try{
  const saved=localStorage.getItem(STORAGE_KEY);
  if(saved===null)return DEFAULT_ITEMS;
  const parsed=JSON.parse(saved);
  if(!Array.isArray(parsed))return DEFAULT_ITEMS;
  return parsed.filter(item=>item&&typeof item.id==='string'&&typeof item.name==='string'&&typeof item.checked==='boolean')
   .map(item=>({id:item.id,name:item.name,checked:item.checked,checkedAt:item.checked&&typeof item.checkedAt==='string'?item.checkedAt:null}));
 }catch(error){return DEFAULT_ITEMS;}
}
let items=loadItems();

function saveItems(){
 try{localStorage.setItem(STORAGE_KEY,JSON.stringify(items));}
 catch(error){noticeElement.textContent='保存できませんでした。ブラウザの保存設定を確認してください。';}
}
function formatDate(value){
 const date=new Date(value);
 if(Number.isNaN(date.getTime()))return '';
 return new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(date);
}
function render(){
 listElement.replaceChildren();
 items.forEach(item=>{
  const row=document.createElement('div');row.className=`item${item.checked?' done':''}`;
  const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.checked=item.checked;
  checkbox.setAttribute('aria-label',`${item.name}を実行済みにする`);
  checkbox.addEventListener('change',()=>{
   item.checked=checkbox.checked;
   item.checkedAt=item.checked?new Date().toISOString():null;
   saveItems();render();
  });
  const content=document.createElement('div');content.className='item-content';
  const name=document.createElement('span');name.className='item-name';name.textContent=item.name;
  const timestamp=document.createElement('span');timestamp.className='timestamp';
  timestamp.textContent=item.checked&&item.checkedAt?`チェック日時：${formatDate(item.checkedAt)}`:'未チェック';
  content.append(name,timestamp);row.append(checkbox,content);
  const remove=document.createElement('button');remove.type='button';remove.className='remove';remove.textContent='削除';
  remove.setAttribute('aria-label',`${item.name}を削除`);
  remove.addEventListener('click',()=>{items=items.filter(entry=>entry.id!==item.id);saveItems();render();});
  row.append(remove);
  listElement.append(row);
 });
 const done=items.filter(item=>item.checked).length;
 countElement.textContent=`${done} / ${items.length} 件`;
 progressElement.style.width=items.length?`${done/items.length*100}%`:'0%';
}
document.getElementById('resetChecks').addEventListener('click',()=>{
 items.forEach(item=>{item.checked=false;item.checkedAt=null;});
 saveItems();
 render();
 noticeElement.textContent='すべてのチェックをオフにしました。項目はそのまま残っています。';
});

form.addEventListener('submit',event=>{
 event.preventDefault();const name=newItemInput.value.trim();
 if(!name){noticeElement.textContent='項目名を入力してください。';newItemInput.focus();return;}
 items.push({id:`custom-${Date.now()}-${Math.random().toString(36).slice(2,8)}`,name,checked:false,checkedAt:null});
 saveItems();render();newItemInput.value='';noticeElement.textContent='';newItemInput.focus();
});
render();
</script>
</body>
</html>
